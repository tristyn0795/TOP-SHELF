# Builds the Google Play app (a Trusted Web Activity around the live site) with Bubblewrap.
# Run it from the Actions tab: "Android app (Google Play)" > Run workflow.
# Needs three repository secrets (see store/PUBLISHING.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
name: Android app (Google Play)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: Version shown on Google Play (e.g. 1.7.0)
        required: true
        default: 1.7.0
      versionCode:
        description: Build number, must go up with every upload (leave empty to use the run number)
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KP" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD under Settings > Secrets and variables > Actions (see store/PUBLISHING.md)."
            exit 1
          fi

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore the upload key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > android.keystore

      - name: Set the version
        env:
          NAME: ${{ inputs.versionName }}
          CODE: ${{ inputs.versionCode || github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersion = process.env.NAME;
            m.appVersionCode = Number(process.env.CODE);
            if (!Number.isInteger(m.appVersionCode) || m.appVersionCode < 1) throw new Error("versionCode must be a positive whole number");
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2) + "\n");
            console.log(`Building ${m.packageId} ${m.appVersion} (${m.appVersionCode}) for https://${m.host}`);
          '

      - name: Generate the Android project
        run: bubblewrap update --skipVersionUpgrade

      - name: Build and sign
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload key fingerprint (for ANDROID_SHA256 on Railway)
        env:
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias topshelf -storepass "$KSP" | sed -n 's/.*SHA256: //p')
          echo "Upload key SHA-256: $FP"
          echo "### Upload key SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$FP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Add this, plus the App signing key SHA-256 from Play Console, to ANDROID_SHA256 on Railway." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f android.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: top-shelf-android-${{ inputs.versionName }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
